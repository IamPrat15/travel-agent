databases:
  - name: travel-agent-db
    plan: free
    databaseName: travel_agent
    user: travel_agent

services:
  # ---------------- Backend API ----------------
  - type: web
    name: travel-agent-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate && npm run build && npx prisma db push --skip-generate --accept-data-loss && npx prisma db seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: travel-agent-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false   # set this in Render dashboard — leave blank to use regex fallback
      - key: CORS_ORIGIN
        sync: false   # set to https://travel-agent-web-XXXX.onrender.com after first deploy
      - key: PORT
        value: 10000

  # ---------------- Frontend (static site) ----------------
  - type: web
    name: travel-agent-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_API_URL
        sync: false   # set to https://travel-agent-api-XXXX.onrender.com after first deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
